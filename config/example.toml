version = 1

[endpoint]
mode = "attach"
base_url = "http://127.0.0.1:8080"
model = "qwen3.8-27b-local"
# Request dialect. "llamacpp" sends llama.cpp sampling extensions and
# chat_template_kwargs; "openai" restricts the body to standard Chat
# Completions fields for generic OpenAI-compatible endpoints.
api = "llamacpp"
# Environment variable holding a bearer token (e.g. "OPENAI_API_KEY").
# The key value is read from the environment, never stored here.
# api_key_env = "OPENAI_API_KEY"
allow_private_lan = false
# Public endpoints require this opt-in AND https. Local-first default.
allow_public_endpoint = false

[generation]
active_profile = "balanced"

[generation.profiles.fast]
enable_thinking = false
preserve_thinking = true
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0
max_tokens = 8192

[generation.profiles.balanced]
enable_thinking = true
reasoning_effort = "medium"
preserve_thinking = true
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
max_tokens = 16384

[generation.profiles.deep]
enable_thinking = true
reasoning_effort = "xhigh"
preserve_thinking = true
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
max_tokens = 32768

[managed_server]
enabled = false
binary = "auto"
model_path = "/Users/dofa/.lmstudio/models/lmstudio-community/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_K_M.gguf"
mmproj_path = "/Users/dofa/.lmstudio/models/lmstudio-community/Qwen3.8-27B-GGUF/mmproj-Qwen3.8-27B-BF16.gguf"
host = "127.0.0.1"
port = 8080
context_size = 150000
batch_size = 2048
micro_batch_size = 512
gpu_layers = "all"
flash_attention = true
cache_type_k = "q8_0"
cache_type_v = "q8_0"
parallel_slots = 1
metrics = true

[managed_server.speculative]
mode = "none"
