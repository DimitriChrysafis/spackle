[workspace]
members = [
    "crates/spackle-cli",
    "crates/spackle-core",
    "crates/spackle-llamacpp",
    "crates/spackle-tools",
    "crates/spackle-tui",
    "crates/spackle-offline-deps",
]
default-members = [
    "crates/spackle-cli",
    "crates/spackle-core",
    "crates/spackle-llamacpp",
    "crates/spackle-tools",
    "crates/spackle-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Dimitri Chrysafis"]

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
criterion = "0.5"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
diffy = "0.4"
eventsource-stream = "0.2"
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
hex = "0.4"
http = "1.3"
humantime-serde = "1.1"
ignore = "0.4"
insta = "1.43"
mime_guess = "2.0"
portable-pty = "0.9"
predicates = "3.1"
proptest = "1.7"
ratatui = { version = "0.29", features = ["crossterm", "serde"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "json", "stream"] }
schemars = "1.0"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
similar = "2.7"
sysinfo = "0.36"
tempfile = "3.20"
textwrap = "0.16"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
toml_edit = { version = "0.23", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.17", features = ["serde", "v4"] }
which = "8.0"
zeroize = "1.8"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dev]
debug = 1
