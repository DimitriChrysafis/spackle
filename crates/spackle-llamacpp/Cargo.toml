[package]
name = "spackle-llamacpp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "llama.cpp server adapter: streaming SSE transport over the Chat Completions API with local-only endpoint policy"
license = "MIT"
publish = false

[lib]
name = "spackle_llamacpp"
path = "src/lib.rs"

[dependencies]
spackle-core = { path = "../spackle-core" }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[dependencies.reqwest]
version = "0.12"
default-features = false
features = [
  "http2",
  "json",
  "rustls-tls",
  "stream",
]

[dev-dependencies]
axum = { workspace = true }
proptest = { workspace = true }
